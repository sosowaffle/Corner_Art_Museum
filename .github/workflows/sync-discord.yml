
      - name: Commit updated profile pictures
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir -p assets/avatars

          if [ -d "scripts/assets/avatars" ]; then
            find scripts/assets/avatars \
              -maxdepth 1 -type f -name "*.png" \
              -exec cp {} assets/avatars/ \;
          fi

          git add -A -- assets/avatars/

          if git diff --cached --quiet; then
            echo "No new profile pictures to save."
            exit 0
          fi

          git commit -m "museum: update Discord avatars"
          git pull --rebase origin main
          git push origin HEAD:main

          echo "Profile pictures saved successfully."
