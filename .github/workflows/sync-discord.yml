name: Sync Discord Artworks

on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: discord-art-museum-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync Discord Gallery
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate artwork database
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          f = Path('gallery.json')
          if not f.exists():
              raise SystemExit('gallery.json is missing. Restore it before syncing.')
          payload = json.loads(f.read_text(encoding='utf-8'))
          if not isinstance(payload, dict) or not isinstance(payload.get('artworks'), list):
              raise SystemExit('gallery.json must have an artworks array.')
          print(f"Existing artworks: {len(payload['artworks'])}")
          PY

      - name: Check Discord bot token
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: |
          if [ -z "$DISCORD_BOT_TOKEN" ]; then
            echo '::error::DISCORD_BOT_TOKEN is missing.'
            exit 1
          fi

      - name: Fetch artwork from Discord
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: python scripts/sync_discord.py

      - name: Update Discord profile pictures
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: python scripts/sync_discord_avatars.py

      - name: Commit artwork and avatar updates
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- gallery.json sync-state.json
          if [ -d assets/artworks ]; then
            git add -A -- assets/artworks
          fi
          if [ -d assets/avatars ]; then
            git add -A -- assets/avatars
          fi
          if git diff --cached --quiet; then
            echo 'No changes to save.'
            exit 0
          fi
          git commit -m 'museum: sync Discord artworks and avatars'
          git pull --rebase origin main
          git push origin HEAD:main
